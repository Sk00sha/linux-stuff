id: 05-networking/dns
title: Teach the client to find the database
runtime: docker
services: [client, dns, router, web01, db01]
login: {service: client, user: bob}
minutes: 20
tasks:
  - id: t1
    text: On client, add an /etc/hosts entry so that the name db01 resolves to 10.10.2.20.
  - id: t2
    text: Configure client to use the company DNS server at 10.10.1.53 as its only nameserver, so that db.company.local resolves.
  - id: t3
    text: Add company.local as a search domain on client, so that short names like www and mail resolve.
  - id: t4
    text: Look up the MX record of company.local and write the name of the mail server it points to into /home/bob/mx.txt.
