id: 02-linux-core-concepts/03-working-with-hardware
title: "Quiz: Working with Hardware"
pass_mark: 0.7
questions:
  - id: q1
    prompt: Which command shows the kernel's messages, such as a newly detected disk?
    options: {a: lsblk, b: dmesg, c: lspci, d: free}
    answer: b
    explanation: dmesg prints the kernel ring buffer, where drivers log device detection. journalctl -k shows the same messages from the journal.
  - id: q2
    prompt: Which component creates the device files under /dev and symlinks like /dev/disk/by-id?
    options: {a: GRUB, b: udev (systemd-udevd), c: cron, d: The BIOS}
    answer: b
    explanation: The kernel sends a uevent when a device appears; udev in user space creates the /dev entry and applies naming rules.
  - id: q3
    prompt: Which command shows disks, partitions and their mount points as a tree?
    options: {a: lsblk, b: lscpu, c: lsmod, d: lsusb}
    answer: a
    explanation: lsblk lists block devices hierarchically with sizes, types and mount points.
  - id: q4
    prompt: What is true about the /proc directory?
    options: {a: It stores program binaries, b: Its contents are generated by the kernel when read and are not stored on disk, c: It contains backup copies of /etc, d: It only exists on Rocky Linux}
    answer: b
    explanation: /proc is a virtual filesystem; files like /proc/meminfo and /proc/cpuinfo are produced on the fly by the kernel.
  - id: q5
    prompt: Which command reports total and free memory in megabytes?
    options: {a: lspci -m, b: free -m, c: du -m, d: lscpu -m}
    answer: b
    explanation: free -m shows RAM and swap usage in MiB; lsmem shows memory blocks.
