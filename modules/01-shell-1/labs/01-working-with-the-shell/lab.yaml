id: 01-shell-1/working-with-the-shell
title: Organise the Asia office notes
runtime: docker
services: [ubuntu]
login: {service: ubuntu, user: bob}
minutes: 20
tasks:
  - id: t1
    text: Create the directory tree /home/bob/asia/india/mumbai (owned by bob).
  - id: t2
    text: Copy /home/bob/notes/city-guide.txt into /home/bob/asia/india/mumbai/, keeping its name. The original must stay where it is.
  - id: t3
    text: The previous contractor misspelled a directory as /home/bob/projetcs. Rename it to /home/bob/projects without losing its contents.
  - id: t4
    text: Delete the directory /home/bob/old-contractor-tmp and everything inside it.
  - id: t5
    text: Save the one-line description of the ls command, as printed by whatis, into /home/bob/whatis.txt.
