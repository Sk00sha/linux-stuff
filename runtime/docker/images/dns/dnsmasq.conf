# dnsmasq configuration for the course's company.local zone.
# Anything not in company.local is forwarded to Docker's embedded resolver.
no-resolv
no-hosts
server=127.0.0.11
local=/company.local/
domain=company.local
host-record=db.company.local,db01.company.local,10.10.2.20
host-record=web01.company.local,10.10.1.80
host-record=mail.company.local,10.10.1.25
cname=www.company.local,web01.company.local
mx-host=company.local,mail.company.local,10
txt-record=company.local,"Caleston Ltd internal zone"
