# Single source of truth for the course structure. bin/course, SYLLABUS.md
# and the tests are all driven by this file. Paths are relative to the repo root.
title: Linux Basics — Hands-On
version: 1.0.0
modules:
  - id: 01-shell-1
    title: Working with Shell I
    runtime: docker
    items:
      - {type: story,  path: modules/01-shell-1/00-story.md}
      - {type: lesson, path: modules/01-shell-1/lessons/01-introduction-to-shell.md, minutes: 10}
      - {type: quiz,   path: modules/01-shell-1/quizzes/01-introduction-to-shell.yaml}
      - {type: lesson, path: modules/01-shell-1/lessons/02-basic-linux-commands.md, minutes: 15}
      - {type: quiz,   path: modules/01-shell-1/quizzes/02-basic-linux-commands.yaml}
      - {type: lesson, path: modules/01-shell-1/lessons/03-command-line-help.md, minutes: 10}
      - {type: quiz,   path: modules/01-shell-1/quizzes/03-command-line-help.yaml}
      - {type: lesson, path: modules/01-shell-1/lessons/04-lab-introduction.md, minutes: 5}
      - {type: lab,    path: modules/01-shell-1/labs/01-working-with-the-shell}
      - {type: lesson, path: modules/01-shell-1/lessons/05-bash-shell.md, minutes: 15}
      - {type: quiz,   path: modules/01-shell-1/quizzes/05-bash-shell.yaml}
      - {type: lab,    path: modules/01-shell-1/labs/02-bash-prompt}

  - id: 02-linux-core-concepts
    title: Linux Core Concepts
    runtime: vm
    items:
      - {type: story,  path: modules/02-linux-core-concepts/00-story.md}
      - {type: lesson, path: modules/02-linux-core-concepts/lessons/01-bobs-first-team-meeting.md, minutes: 5}
      - {type: lesson, path: modules/02-linux-core-concepts/lessons/02-linux-kernel.md, minutes: 15}
      - {type: quiz,   path: modules/02-linux-core-concepts/quizzes/02-linux-kernel.yaml}
      - {type: lesson, path: modules/02-linux-core-concepts/lessons/03-working-with-hardware.md, minutes: 15}
      - {type: quiz,   path: modules/02-linux-core-concepts/quizzes/03-working-with-hardware.yaml}
      - {type: lesson, path: modules/02-linux-core-concepts/lessons/04-linux-boot-sequence.md, minutes: 15}
      - {type: quiz,   path: modules/02-linux-core-concepts/quizzes/04-linux-boot-sequence.yaml}
      - {type: lesson, path: modules/02-linux-core-concepts/lessons/05-runlevels.md, minutes: 10}
      - {type: quiz,   path: modules/02-linux-core-concepts/quizzes/05-runlevels.yaml}
      - {type: lesson, path: modules/02-linux-core-concepts/lessons/06-article-runlevels.md, minutes: 5}
      - {type: lesson, path: modules/02-linux-core-concepts/lessons/07-file-types.md, minutes: 15}
      - {type: quiz,   path: modules/02-linux-core-concepts/quizzes/07-file-types.yaml}
      - {type: lesson, path: modules/02-linux-core-concepts/lessons/08-filesystem-hierarchy.md, minutes: 10}
      - {type: quiz,   path: modules/02-linux-core-concepts/quizzes/08-filesystem-hierarchy.yaml}
      - {type: lab,    path: modules/02-linux-core-concepts/labs/01-kernel-modules-boot-filetypes}

  - id: 03-package-management
    title: Package Management
    runtime: docker
    items:
      - {type: story,  path: modules/03-package-management/00-story.md}
      - {type: lesson, path: modules/03-package-management/lessons/01-package-management-introduction.md, minutes: 10}
      - {type: quiz,   path: modules/03-package-management/quizzes/01-package-management-introduction.yaml}
      - {type: lesson, path: modules/03-package-management/lessons/02-rpm-and-yum.md, minutes: 20}
      - {type: quiz,   path: modules/03-package-management/quizzes/02-rpm-and-yum.yaml}
      - {type: lab,    path: modules/03-package-management/labs/01-yum-and-rpm}
      - {type: lesson, path: modules/03-package-management/lessons/03-dpkg-and-apt.md, minutes: 20}
      - {type: quiz,   path: modules/03-package-management/quizzes/03-dpkg-and-apt.yaml}
      - {type: lesson, path: modules/03-package-management/lessons/04-apt-vs-apt-get.md, minutes: 5}
      - {type: quiz,   path: modules/03-package-management/quizzes/04-apt-vs-apt-get.yaml}
      - {type: lab,    path: modules/03-package-management/labs/02-dpkg-and-apt}
